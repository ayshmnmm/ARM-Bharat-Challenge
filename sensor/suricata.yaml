%YAML 1.1
---
# NetWatch sensor config: Suricata in passive IDS mode as a protocol/flow logger.
# - Live capture on wlan0 ONLY (never eth0), af-packet without promiscuous mode,
#   no inline/IPS copy mode, so it can never affect forwarding.
# - Detection engine disabled for now (run with --disable-detection); NetWatch's own
#   detectors consume the EVE JSON records.
# - Memory caps keep it well inside the router's headroom.

vars:
  address-groups:
    HOME_NET: "[192.168.1.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

default-log-dir: /var/lib/netwatch/sensor
classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

stats:
  enabled: no

# No control socket: the sensor must not listen on anything.
unix-command:
  enabled: no

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      community-id: yes
      ethernet: yes
      types:
        - flow
        - dns:
            version: 2
            requests: yes
            responses: yes
            formats: [detailed]
        - tls:
            extended: yes
            custom: [subject, issuer, sni, version, ja3, ja3s, ja4, not_before, not_after]
        - quic
        - http:
            extended: yes
        - dhcp:
            enabled: yes
            extended: yes
        - ssh
        - anomaly:
            enabled: no

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: no

af-packet:
  - interface: wlan0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes
    ring-size: 4096
    disable-promisc: yes
    copy-mode: none

pcap-file:
  checksum-checks: no

app-layer:
  protocols:
    tls:
      enabled: yes
      detection-ports:
        dp: 443
      ja3-fingerprints: yes
      ja4-fingerprints: yes
    quic:
      enabled: yes
    http:
      enabled: yes
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53
    dhcp:
      enabled: yes
    ssh:
      enabled: yes

# Short timeouts so flows are logged (and detected) quickly.
flow-timeouts:
  default:
    new: 15
    established: 120
    closed: 0
    emergency-new: 5
    emergency-established: 30
    emergency-closed: 0
  tcp:
    new: 10
    established: 300
    closed: 5
    emergency-new: 5
    emergency-established: 60
    emergency-closed: 0
  udp:
    new: 15
    established: 60
    emergency-new: 5
    emergency-established: 15
  icmp:
    new: 15
    established: 30
    emergency-new: 5
    emergency-established: 10

flow:
  memcap: 64mb
  hash-size: 65536
  prealloc: 10000

stream:
  memcap: 64mb
  checksum-validation: no
  reassembly:
    memcap: 128mb
    depth: 1mb

defrag:
  memcap: 16mb

host:
  memcap: 16mb

max-pending-packets: 1024
runmode: autofp
